<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="leatherBag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="stickmanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- High-contrast White Underlay (Ensures 100% legibility on dark and light browser tabs) -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- White outline for legs & torso -->
    <path d="M28 33 L18 41 L9 47" stroke-width="7" fill="none"/>
    <path d="M28 33 L40 39 L48 53" stroke-width="7" fill="none"/>
    <line x1="38" y1="17" x2="28" y2="33" stroke-width="7"/>
    <!-- White outline for arms -->
    <path d="M35 21 L24 25 L18 30" stroke-width="7" fill="none"/>
    <path d="M35 21 L46 24 L50 18" stroke-width="7" fill="none"/>
    <!-- White outline for head -->
    <circle cx="40" cy="11" r="7.5" fill="#ffffff" stroke-width="2"/>
    <!-- White outline for bag -->
    <rect x="6.5" y="28.5" width="23" height="18" rx="4" fill="#ffffff" stroke-width="3"/>
  </g>

  <!-- Speed Dust / Motion Lines -->
  <line x1="4" y1="48" x2="7" y2="48" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="3" y1="52" x2="8" y2="52" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- RECRUITER BAG (Held in trailing hand) -->
  <!-- Bag Handle -->
  <path d="M14 30 C14 25 22 25 22 30" fill="none" stroke="#78350f" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Bag Body (Warm recruiter leather) -->
  <rect x="8" y="30" width="20" height="15" rx="3" fill="url(#leatherBag)" stroke="#b45309" stroke-width="1.2"/>
  <!-- Bag Flap & Seam -->
  <path d="M8 35.5 L18 38.5 L28 35.5" fill="none" stroke="#92400e" stroke-width="1.2"/>
  <!-- Straps -->
  <line x1="12.5" y1="30" x2="12.5" y2="45" stroke="#b45309" stroke-width="1" opacity="0.8"/>
  <line x1="23.5" y1="30" x2="23.5" y2="45" stroke="#b45309" stroke-width="1" opacity="0.8"/>
  <!-- Gold Metallic Clasp / Lock -->
  <rect x="16.5" y="37" width="3" height="3.5" rx="0.6" fill="#fde047" stroke="#b45309" stroke-width="0.6"/>
  <circle cx="18" cy="38.7" r="0.5" fill="#78350f"/>

  <!-- RUNNING STICKMAN -->
  <!-- Torso (Leaning forward into the run) -->
  <line x1="38" y1="17" x2="28" y2="33" stroke="url(#stickmanGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Fluttering Recruiter Tie -->
  <polygon points="37,18.5 28,21 31,23.5 35.5,21" fill="#ef4444"/>

  <!-- Back Leg (Kicking backward) -->
  <path d="M28 33 L18 41 L9 47" fill="none" stroke="url(#stickmanGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Front Leg (Dynamic stride forward) -->
  <path d="M28 33 L40 39 L48 53" fill="none" stroke="url(#stickmanGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Arm (Holding the bag handle at (18, 30)) -->
  <path d="M35 21 L24 25 L18 30" fill="none" stroke="url(#stickmanGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Arm (Pumping forward in sprint) -->
  <path d="M35 21 L46 24 L50 18" fill="none" stroke="url(#stickmanGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Head -->
  <circle cx="40" cy="11" r="5.8" fill="url(#stickmanGrad)"/>
</svg>
